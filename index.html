
<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
</head>
<body style="margin:0; overflow:hidden;">

  <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false;">

    <a-assets timeout="10000">
      <a-asset-item
        id="miModelo"
        src="modelo.glb">
      </a-asset-item>
    </a-assets>

    <a-marker preset="hiro">

      <a-box
        position="0 0.15 0"
        width="0.3"
        height="0.3"
        depth="0.3"
        color="#4CAF50">
      </a-box>

      <a-entity
        gltf-model="#miModelo"
        position="0 0.3 0"
        scale="0.3 0.3 0.3">
      </a-entity>

      <a-text
        value="Mi primera AR"
        position="0 0.8 0"
        align="center"
        color="#FF0000"
        scale="0.8 0.8 0.8"
        side="double">
      </a-text>

    </a-marker>

    <a-marker preset="kanji">

      <a-cylinder
        position="0 0.25 0"
        radius="0.2"
        height="0.5"
        color="#2196F3">
      </a-cylinder>

    </a-marker>

    <a-entity camera></a-entity>

  </a-scene>

</body>
</html>
