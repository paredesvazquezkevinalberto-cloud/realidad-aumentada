<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Práctica 2 - Modelo 3D y dos marcadores</title>
  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
</head>
<body style="margin:0; overflow:hidden;">
  <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false;">
    <a-assets>
      <a-asset-item id="miModelo" src="modelo.glb"></a-asset-item>
    </a-assets>
    <a-marker preset="hiro">
      <a-entity gltf-model="#miModelo" scale="0.8 0.8 0.8" position="0 0.1 0" rotation="0 0 0" animation="property: rotation; to: 0 360 0; dur: 5000; loop: true; easing: linear"></a-entity>
      <a-text value="Mi primera AR" align="center" color="#FFFFFF" position="0 1.5 0" scale="1.5 1.5 1.5" side="double"></a-text>
    </a-marker>
    <a-marker preset="kanji">
      <a-cylinder color="#FF9800" radius="0.35" height="0.8" position="0 0.4 0" animation="property: rotation; to: 0 360 0; dur: 4000; loop: true; easing: linear"></a-cylinder>
      <a-text value="Marcador Kanji" align="center" color="#FFFFFF" position="0 1.2 0" scale="1.2 1.2 1.2" side="double"></a-text>
    </a-marker>
    <a-entity camera></a-entity>
  </a-scene>
</body>
</html>
