
<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
</head>

<body style="margin:0; overflow:hidden;">

  <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false;">

    <a-assets>
      <a-asset-item id="miModelo" src="modelo.glb"></a-asset-item>
    </a-assets>

    <a-marker preset="hiro">

      <a-entity
        gltf-model="#miModelo"
        scale="0.3 0.3 0.3"
        position="0 0.1 0">
      </a-entity>

      <a-text
        value="¡Mi primera AR!"
        align="center"
        color="#FFFFFF"
        position="0 0.8 0"
        scale="0.8 0.8 0.8"
        side="double">
      </a-text>

    </a-marker>

    <a-marker preset="kanji">

      <a-box
        position="0 0.25 0"
        rotation="0 45 0"
        color="#2196F3"
        scale="0.5 0.5 0.5">
      </a-box>

    </a-marker>

    <a-entity camera></a-entity>

  </a-scene>

</body>
</html>
